<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科學學習中心</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            color: #333;
            margin-bottom: 40px;
        }
        .container {
            display: flex;
            gap: 30px; /* 按鈕之間的距離 */
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 250px;
            transition: transform 0.2s;
            text-decoration: none; /* 去掉底線 */
            color: inherit;
        }
        .card:hover {
            transform: translateY(-10px); /* 滑鼠放上去會浮起來 */
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .icon {
            font-size: 50px;
            display: block;
            margin-bottom: 20px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        .desc {
            color: #666;
            font-size: 14px;
        }
        /* 定義顏色 */
        .chem { border-top: 5px solid #e74c3c; } /* 紅色系 */
        .phy { border-top: 5px solid #3498db; }  /* 藍色系 */
    </style>
</head>
<body>

    <h1>歡迎來到科學學習導覽頁</h1>

    <div class="container">
        
        <a href="/displacementreaction/" class="card chem">
            <span class="icon">⚗️</span>
            <span class="title">置換反應</span>
            <span class="desc">Displacement Reaction<br>化學反應的奧秘</span>
        </a>

        <a href="/snellslaw/" class="card phy">
            <span class="icon">📐</span>
            <span class="title">斯涅爾定律</span>
            <span class="desc">Snell's Law<br>光學折射的原理</span>
        </a>

    </div>

    <footer style="margin-top: 50px; color: #888; font-size: 12px;">
        © 2025 My Science Portfolio
    </footer>

</body>
</html>
